<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5865f2">
  <title>Discord認証</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="mark">D</div>
    <p class="eyebrow">SERVER VERIFICATION</p>
    <h1>Discord認証</h1>
    <p class="description">Discordアカウントを連携して、サーバーへの参加・認証を完了します。</p>
    <div class="notice">
      <strong>情報の取り扱い</strong>
      <p>この認証では、DiscordユーザーID、ユーザー名、メールアドレス、認証日時、接続元IPアドレスを取得し、サーバー管理および不正利用対策の目的で管理者用Webhookへ通知します。</p>
      <p>情報の利用目的、保存期間、問い合わせ先については、認証前に案内されたプライバシー説明をご確認ください。</p>
    </div>
    <a class="button" href="/auth/discord">Discordで認証する</a>
    <p class="small">認証はDiscord公式のOAuth2画面で行われます。</p>
  </main>
</body>
</html>
